services:
  new-api:
    image: ${APP_IMAGE_REPOSITORY:-new-api-fork}:${APP_IMAGE_TAG:?missing APP_IMAGE_TAG}
    pull_policy: never
    build:
      context: ./src
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.source: https://github.com/JasonWangJie/new-api
        org.opencontainers.image.revision: ${APP_IMAGE_TAG:?missing APP_IMAGE_TAG}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 60s
    command: ["--log-dir", "/app/logs"]
    ports:
      - "127.0.0.1:${NEWAPI_PORT:-3000}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - ./images:/images
    environment:
      SQL_DSN: postgresql://newapi:${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}@postgres:5432/newapi
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?missing REDIS_PASSWORD}@redis:6379/0
      MEMORY_CACHE_ENABLED: "false"
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-new-api}
      ASYNC_IMAGE_REDIS_PREFIX: ${ASYNC_IMAGE_REDIS_PREFIX:-new-api:images}
      SESSION_SECRET: ${SESSION_SECRET:?missing SESSION_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?missing CRYPTO_SECRET}
      ASYNC_IMAGE_ACTIVE_KEY_ID: ${ASYNC_IMAGE_ACTIVE_KEY_ID:?missing ASYNC_IMAGE_ACTIVE_KEY_ID}
      ASYNC_IMAGE_PAYLOAD_KEYS: ${ASYNC_IMAGE_PAYLOAD_KEYS:?missing ASYNC_IMAGE_PAYLOAD_KEYS}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:?missing SESSION_COOKIE_TRUSTED_URL}
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: new-api-fork-node-1
      TRUSTED_PROXIES: 127.0.0.1,172.16.0.0/12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://localhost:3000/api/status | grep -q '"success":[[:space:]]*true'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:15
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
      POSTGRES_DB: newapi
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "newapi", "-d", "newapi"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?missing REDIS_PASSWORD}"]
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?missing REDIS_PASSWORD}
